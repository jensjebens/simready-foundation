[project]
name = "simready-validators"
version = "0.1.0"
description = "SimReady capability graph + validators for Omniverse Asset Validator"
authors = [{name = "NVIDIA"}]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "omniverse-usd-profiles>=1.11.2",
]

[project.entry-points."omni.usd_profiles"]
capabilities = "simready_validators:get_capabilities_json_path"

[project.entry-points."omni.asset_validator"]
registrant = "simready_validators.plugin:SimReadyPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simready_validators"]
